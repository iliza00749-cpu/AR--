<!DOCTYPE html>
<html>

<head>
    <script src="js/aframe.min.js"></script>
    <script src="js/zappar-aframe/zappar-aframe.js"></script>

    <meta charset="utf-8" />
    <title>Zappar for A-Frame: Face Tracking 3D Model Example</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Кнопка переключения режима */
        #toggle-mask-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s ease;
            user-select: none;
        }

        #toggle-mask-btn:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        #toggle-mask-btn:active {
            transform: translateX(-50%) scale(0.97);
        }
    </style>
</head>

<body>
    <!-- Кнопка переключения -->
    <button id="toggle-mask-btn">Переключить на 2D</button>

    <a-scene>
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <a-camera zappar-camera="user-facing: true;" />

        <!-- Face tracker -->
        <a-entity zappar-face id="my-face-tracker">

            <!-- Head mask нужен только для 3D-модели -->
            <a-entity id="head-mask"
                      zappar-head-mask="face:#my-face-tracker;"></a-entity>

            <!-- 3D маска -->
            <a-entity id="mask-3d"
                      gltf-model="url(assets/face1.glb)"
                      position="0.3 -1.3 0"
                      scale="1.1 1.1 1.1"
                      visible="true"></a-entity>

            <!-- 2D маска -->
            <a-entity id="mask-2d"
                      geometry="primitive: face-mesh; face: #my-face-tracker"
                      material="src: url(assets/sh.png); transparent: true;"
                      visible="false"></a-entity>

        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('toggle-mask-btn');
        const mask3d = document.getElementById('mask-3d');
        const mask2d = document.getElementById('mask-2d');
        const headMask = document.getElementById('head-mask');

        let is3D = true; // стартовый режим — 3D

        btn.addEventListener('click', () => {
            is3D = !is3D;

            if (is3D) {
                mask3d.setAttribute('visible', true);
                mask2d.setAttribute('visible', false);
                headMask.setAttribute('visible', true);
                btn.textContent = 'Переключить на 2D';
            } else {
                mask3d.setAttribute('visible', false);
                mask2d.setAttribute('visible', true);
                headMask.setAttribute('visible', false);
                btn.textContent = 'Переключить на 3D';
            }
        });
    </script>
</body>

</html>
